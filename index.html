<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Blind rating task for the human study. Open this file in any browser, or use the hosted copy
     linked in INSTRUCTIONS.md. It holds only item ids and names (the same ones as sheet_A.csv and
     sheet_B.csv), never where a name came from. Nothing is sent anywhere: the last screen shows a
     block of text to copy, which scripts/human_tasks.py import turns into rater files. -->
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Name Rating Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, one item at a time. The name is the only large thing on screen. */
:root{
  --bg:#eef1ee; --surface:#ffffff; --ink:#17201b; --muted:#5a665e; --rule:#cfd6d0;
  --accent:#3b3fb5; --accent-ink:#ffffff; --track:#dde3de;
  --r1:#e4e6f6; --r2:#cdd0ef; --r3:#b0b4e6; --r4:#8d92dc; --r5:#6468cf; --scale-ink:#15183f;
  --yes:#1d6a45; --no:#8a3340;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111512; --surface:#1a201c; --ink:#e7ece8; --muted:#9aa69e; --rule:#2e3731;
  --accent:#9ea2f5; --accent-ink:#10122e; --track:#262d28;
  --r1:#23254a; --r2:#2e3166; --r3:#3c4086; --r4:#5257ad; --r5:#7479d6; --scale-ink:#f2f3ff;
  --yes:#7fd0a3; --no:#f09aa6; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1a201c; --ink:#e7ece8; --muted:#9aa69e; --rule:#2e3731;
  --accent:#9ea2f5; --accent-ink:#10122e; --track:#262d28;
  --r1:#23254a; --r2:#2e3166; --r3:#3c4086; --r4:#5257ad; --r5:#7479d6; --scale-ink:#f2f3ff;
  --yes:#7fd0a3; --no:#f09aa6; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 26px/1.15 var(--body);margin:0;text-wrap:balance}
h2{font:700 19px/1.2 var(--body);margin:0}
p{margin:0}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:12px 14px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:8px 10px;font-size:15px}
button:disabled{opacity:.4;cursor:default}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px;width:100%;box-sizing:border-box}
label{font-weight:700}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:500 13px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.question{font-size:16px;color:var(--muted);text-wrap:balance}
.item{min-height:132px;display:flex;align-items:center;justify-content:center;text-align:center;
  font:700 clamp(30px,9vw,46px)/1.15 var(--body);overflow-wrap:anywhere;padding:8px 0}
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;text-align:center;min-height:132px;align-content:center}
.pair .side{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pair .nm{font:700 clamp(26px,8vw,38px)/1.15 var(--body);overflow-wrap:anywhere}
.pair .vs{color:var(--muted);font-size:14px;padding:4px 0}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;border-color:transparent;color:var(--scale-ink)}
.scale button b{font:700 24px/1 var(--body)}
.scale button span{font-size:11.5px;line-height:1.15;text-align:center}
.scale button[data-v="1"]{background:var(--r1)} .scale button[data-v="2"]{background:var(--r2)}
.scale button[data-v="3"]{background:var(--r3)} .scale button[data-v="4"]{background:var(--r4)}
.scale button[data-v="5"]{background:var(--r5)}
.scale button.was,.yn button.was{outline:3px solid var(--ink);outline-offset:1px}
.yn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.yn button{padding:16px 8px;font-weight:700}
.yn button[data-v="1"]{border-color:var(--yes);color:var(--yes)}
.yn button[data-v="0"]{border-color:var(--no);color:var(--no)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
details{border-top:1px solid var(--rule);padding-top:12px}
summary{cursor:pointer;font-size:15px;color:var(--muted)}
.rubric{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.rubric b{display:inline-block;width:1.4em}
textarea{font:13px/1.4 var(--mono);width:100%;box-sizing:border-box;height:180px;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:10px;resize:vertical}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.note{font-size:14px;color:var(--muted)}
kbd{font:500 12px/1 var(--mono);border:1px solid var(--rule);border-radius:4px;padding:2px 5px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .15s ease}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script>
const DATA = {"A":[[1,"nzjfpg"],[2,"ugma"],[3,"ephai"],[4,"clinkling"],[5,"sor"],[6,"natame"],[7,"yalusth"],[8,"xon"],[9,"leshelmin"],[10,"lveiari"],[11,"anskanairrin"],[12,"nyevihs"],[13,"suskan"],[14,"raharsen"],[15,"rmeat"],[16,"dea"],[17,"efin"],[18,"rezucirnajes"],[19,"gobag"],[20,"hau"],[21,"pnumbstrum"],[22,"yrmytrst"],[23,"splhv"],[24,"adamand"],[25,"xtorpi"],[26,"dbrllynzb"],[27,"limysnider"],[28,"audia"],[29,"velliad"],[30,"maxon"],[31,"ajani"],[32,"firefist"],[33,"mist-rd"],[34,"ormyt"],[35,"temperance"],[36,"kithorgrimmirah"],[37,"davor"],[38,"rlbfsu"],[39,"tobald"],[40,"josthand"],[41,"enoukcdbv"],[42,"crthus"],[43,"iorya"],[44,"autchath"],[45,"arita"],[46,"nyn"],[47,"juwhuik"],[48,"murgor"],[49,"cavelius"],[50,"valen"],[51,"kosef"],[52,"pharn"],[53,"cefegi"],[54,"nianya"],[55,"aerus"],[56,"valindra"],[57,"jonathan"],[58,"prix"],[59,"juffine"],[60,"flow"],[61,"hatori"],[62,"derr"],[63,"aedrica"],[64,"sayana"],[65,"hrtax"],[66,"maelpean"],[67,"leorixar"],[68,"tirus"],[69,"mdmckrx"],[70,"sarain"],[71,"barindiis"],[72,"kleemacklam"],[73,"erina"],[74,"veskar"],[75,"gradar"],[76,"odragoylatrina"],[77,"tole"],[78,"amosphodeagrra"],[79,"andro"],[80,"gura'dun"],[81,"yeagjd"],[82,"flema"],[83,"rejas"],[84,"avenl"],[85,"jryin"],[86,"caineth"],[87,"str"],[88,"kalandra"],[89,"j'baru"],[90,"enn"],[91,"skarn"],[92,"ulya"],[93,"lubbrinneus"],[94,"blarg"],[95,"klaa"],[96,"etzhnen"],[97,"ddcumjz"],[98,"oghatzhan"],[99,"sonice"],[100,"oommpeth"],[101,"shaksste"],[102,"dasa"],[103,"magwass"],[104,"luel"],[105,"enaretinatth"],[106,"symphonia"],[107,"edras"],[108,"katateenill"],[109,"cose"],[110,"bjbqin"],[111,"gaia"],[112,"abookain"],[113,"hidera"],[114,"erebus"],[115,"bly"],[116,"faeryl"],[117,"dsenma"],[118,"klenkosolek"],[119,"dalvir"],[120,"gully"]],"B":[[1,"poopbub","boorab"],[2,"lbrixid","brixid"],[3,"pantstroke","angstrom"],[4,"grunt","grunty"],[5,"trey","treydal"],[6,"mokch","moloch"],[7,"aessus","aengus"],[8,"malstone","alston"],[9,"kirrel","kiliel"],[10,"livalar","advalur"],[11,"arydaman","ardamar"],[12,"lamara","lamar"],[13,"mege","meg"],[14,"corgiss","corgius"],[15,"cadh","cadha"],[16,"leaugun","daugon"],[17,"sapphira","saphira"],[18,"rale","ral"],[19,"bartchast","bart"],[20,"patel","pavel"],[21,"beads","beans"],[22,"dene","den"],[23,"simorn","simon"],[24,"cevella","evella"],[25,"lorenian","loren"],[26,"balvenhamper","manhammer"],[27,"balter","balor"],[28,"assina","asina"],[29,"karri","khari"],[30,"laurian","ladrian"],[31,"lura","luraan"],[32,"endern","ender"],[33,"gimblebop","bimblebop"],[34,"bayeer","bayoer"],[35,"kiara","kiaran"],[36,"mirabella","mirabelle"],[37,"elinor","elinnor"],[38,"stehlys","adelys"],[39,"nrija","krija"],[40,"illiam","billiam"],[41,"guttarbles","bubbles"],[42,"hasteilnlae","stella"],[43,"elazas","elza"],[44,"aera","aela"],[45,"finnata","finnan"],[46,"albom","abbot"],[47,"oly","oli"],[48,"pyr","pyrs"],[49,"fuindrick","fundrick"],[50,"racone","raconis"],[51,"mrzy","marty"],[52,"pite","pyt"],[53,"aurin","auryn"],[54,"melisa","melissa"],[55,"raameris","rameris"],[56,"valana","vala"],[57,"lean","leanne"],[58,"raex","raen"],[59,"gyth","gyt"],[60,"korah","cora"]],"repeats":[19,23,25,27,33,35,70,74,96,98]};
const KEY = "name-rating-study-v1";
const QUESTION_A = "Could this be the given name of a character in a fantasy role-playing game such as Dungeons & Dragons?";
const ANCHORS = [
  [5,"Yes","Reads as a finished name. You would not look twice at it on a character sheet."],
  [4,"Probably","Sounds like a name, with something slightly off."],
  [3,"Borderline","Pronounceable, but it is unclear whether it is a name."],
  [2,"Probably not","Awkward letter sequences, or it reads as a fragment."],
  [1,"No","Unpronounceable or random letters."]];
const QUESTION_B = "Is the first name basically the second name: a respelling, or the same name with a small addition or change?";
const nameA = new Map(DATA.A.map(([id, n]) => [id, n]));
const pairB = new Map(DATA.B.map(([id, l, r]) => [id, [l, r]]));
const app = document.getElementById("app");
let S = null, t0 = 0, armedReset = false;

function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Every rater gets the same items in their own random order. Ten names come back a second
// time, at least 40 items later, to measure how consistent each rater is with themselves.
function buildSeq(rater){
  const r = rng(hash(rater.toLowerCase() + "|A"));
  const reps = DATA.repeats, repSet = new Set(reps);
  const others = shuffle(DATA.A.map(x => x[0]).filter(id => !repSet.has(id)), r);
  const first = shuffle(reps.concat(others.slice(0, 50)), r);
  const seq = first.concat(others.slice(50)).map(id => ({k: "A", id}));
  for (const id of shuffle(reps, r)){
    const pos = 100 + Math.floor(r() * (seq.length - 100 + 1));
    seq.splice(pos, 0, {k: "A2", id});
  }
  const rb = rng(hash(rater.toLowerCase() + "|B"));
  return seq.concat(shuffle(DATA.B.map(x => x[0]), rb).map(id => ({k: "B", id})));
}
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.seq && s.ans ? s : null; } catch (e) { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function wipe(){ try { localStorage.removeItem(KEY); } catch (e) {} S = null; }
const el = (tag, attrs = {}, kids = []) => { const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){ if (k === "text") n.textContent = v; else if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn); else n.setAttribute(k, v); }
  for (const c of [].concat(kids)) if (c) n.append(c); return n; };
const keyOf = it => it.k + ":" + it.id;
const firstB = () => S.seq.findIndex(it => it.k === "B");

function render(){
  app.replaceChildren();
  if (!S) return intro();
  if (S.pos >= S.seq.length) return done();
  if (S.pos === firstB() && !S.seenB) return interlude();
  S.seq[S.pos].k === "B" ? itemB() : itemA();
  t0 = performance.now();
}

function intro(){
  const saved = load();
  const input = el("input", {type: "text", id: "rater", autocomplete: "given-name", placeholder: "first name"});
  const start = () => { const name = input.value.trim().replace(/[^A-Za-z0-9_-]/g, "").toLowerCase(); if (!name) { input.focus(); return; }
    S = {v: 1, rater: name, seq: buildSeq(name), pos: 0, ans: {}, seenB: false}; save(); render(); };
  input.addEventListener("keydown", e => { if (e.key === "Enter") start(); });
  app.append(
    el("div", {class: "stack"}, [el("div", {class: "eyebrow", text: "CMSC 723 · Creativity vs. Loss"}), el("h1", {text: "Name rating study"}),
      el("p", {class: "muted", text: "About 15 minutes. Two parts: rate 130 names from 1 to 5, then answer yes or no on 60 pairs of names."})]),
    el("div", {class: "panel"}, [el("h2", {text: "Before you start"}),
      el("ol", {class: "steps"}, [
        el("li", {text: "Do it alone, in one sitting."}),
        el("li", {text: "Go with your first reaction. Do not look any name up."}),
        el("li", {text: "Do not discuss the names with the others until all three of us are done."}),
        el("li", {text: "At the end you get a block of text. Send it to Andre."})])]),
    saved ? el("div", {class: "panel"}, [el("h2", {text: "Pick up where you left off"}),
      el("p", {class: "muted", text: saved.rater + ", item " + Math.min(saved.pos + 1, saved.seq.length) + " of " + saved.seq.length + "."}),
      el("button", {class: "primary", id: "resume", text: "Resume", on: {click: () => { S = saved; render(); }}})]) : null,
    el("div", {class: "panel"}, [el("label", {for: "rater", text: saved ? "Or start over as" : "Your first name"}), input,
      el("button", {class: saved ? "" : "primary", id: "start", text: "Start", on: {click: start}}),
      el("p", {class: "note", text: "Progress is kept in this browser, so you can close the tab and come back on the same device."})]));
}

function header(part, question){
  const n = S.seq.length;
  const bar = el("div", {class: "bar"}, el("i")); bar.firstChild.style.width = (100 * S.pos / n) + "%";
  return [el("div", {class: "meta"}, [el("span", {text: part}), el("span", {text: (S.pos + 1) + " / " + n})]), bar,
          el("p", {class: "question", text: question})];
}
function footer(extra){
  return el("div", {class: "row"}, [
    el("button", {class: "quiet", id: "back", text: "← Back", ...(S.pos === 0 ? {disabled: ""} : {}), on: {click: back}}), extra]);
}
function answer(v){ const it = S.seq[S.pos]; S.ans[keyOf(it)] = {v, ms: Math.round(performance.now() - t0)}; S.pos++; save(); render(); }
function back(){ if (S.pos > 0){ S.pos--; save(); render(); } }

function itemA(){
  const it = S.seq[S.pos], prev = S.ans[keyOf(it)];
  const scale = el("div", {class: "scale", role: "group", "aria-label": "Rating from 1 to 5"},
    ANCHORS.slice().reverse().map(([v, word]) => el("button", {"data-v": v, id: "rate" + v, class: prev && prev.v === v ? "was" : "", "aria-label": v + ", " + word, on: {click: () => answer(v)}},
      [el("b", {text: v}), el("span", {text: word})])));
  const det = el("details", S.pos < 3 ? {open: ""} : {}, [el("summary", {text: "What the numbers mean"}),
    el("ul", {class: "rubric"}, ANCHORS.map(([v, word, long]) => el("li", {}, [el("b", {text: v}), document.createTextNode(word + ". " + long)]))),
    el("p", {class: "note", text: "Names are lowercase and may contain apostrophes or hyphens. Judge only whether the name works as a name. Do not reward a name for being familiar, and do not penalize it for being unusual."})]);
  app.append(el("div", {class: "panel"}, [...header("Part 1 of 2 · names", QUESTION_A), el("div", {class: "item", id: "item", text: nameA.get(it.id)}), scale,
    footer(el("span", {class: "note"}, [document.createTextNode("Keys "), el("kbd", {text: "1"}), document.createTextNode(" to "), el("kbd", {text: "5"})])), det]));
}
function itemB(){
  const it = S.seq[S.pos], prev = S.ans[keyOf(it)], [l, r] = pairB.get(it.id);
  const yn = el("div", {class: "yn", role: "group", "aria-label": "Same name or different"}, [
    el("button", {"data-v": 1, id: "same", class: prev && prev.v === 1 ? "was" : "", text: "Same name", on: {click: () => answer(1)}}),
    el("button", {"data-v": 0, id: "different", class: prev && prev.v === 0 ? "was" : "", text: "Different name", on: {click: () => answer(0)}})]);
  app.append(el("div", {class: "panel"}, [...header("Part 2 of 2 · pairs", QUESTION_B),
    el("div", {class: "pair", id: "item"}, [el("div", {class: "nm", text: l}), el("div", {class: "vs", text: "compared with"}), el("div", {class: "nm", text: r})]), yn,
    footer(el("span", {class: "note"}, [document.createTextNode("Keys "), el("kbd", {text: "Y"}), document.createTextNode(" / "), el("kbd", {text: "N"})])),
    el("p", {class: "note", text: "Examples: jonn and jon are the same name. kaius and caius are the same name. torvus and corvus are different, a different first letter makes a different name."})]));
}
function interlude(){
  app.append(el("div", {class: "panel"}, [el("div", {class: "eyebrow", text: "Part 1 done"}), el("h2", {text: "Part 2: pairs of names"}),
    el("p", {text: QUESTION_B}),
    el("p", {class: "muted", text: "60 pairs. Answer Same name or Different name. This part goes quickly."}),
    el("button", {class: "primary", id: "continue", text: "Continue", on: {click: () => { S.seenB = true; save(); render(); }}}),
    el("button", {class: "quiet", text: "← Back to the last name", on: {click: back}})]));
}
function resultText(){
  const lines = ["CVL-RATINGS v1", "rater: " + S.rater];
  for (const it of S.seq){ const a = S.ans[keyOf(it)]; if (a) lines.push([it.k, it.id, a.v, a.ms].join(",")); }
  lines.push("END"); return lines.join("\n");
}
function done(){
  const ta = el("textarea", {id: "result", readonly: "", "aria-label": "Your ratings"}); ta.value = resultText();
  const status = el("span", {class: "note", id: "copystatus", role: "status"});
  const copy = el("button", {class: "primary", id: "copy", text: "Copy my ratings", on: {click: () => {
    const fallback = () => { ta.focus(); ta.select(); status.textContent = "Selected. Copy it with your keyboard or the share menu."; };
    try { navigator.clipboard.writeText(ta.value).then(() => { status.textContent = "Copied."; }, fallback); } catch (e) { fallback(); } }}});
  const canShare = typeof navigator.share === "function";
  const send = canShare ? el("button", {class: "primary", id: "send", text: "Send my ratings", on: {click: () => {
    navigator.share({title: "Name ratings from " + S.rater, text: ta.value}).then(
      () => { status.textContent = "Shared."; },
      () => { status.textContent = "Not sent. Try again, or use Copy."; }); }}}) : null;
  if (canShare) copy.className = "";
  const reset = el("button", {class: "quiet", id: "reset", text: "Start over", on: {click: () => {
    if (!armedReset){ armedReset = true; reset.textContent = "Tap again to erase my ratings"; return; }
    armedReset = false; wipe(); render(); }}});
  app.append(el("div", {class: "panel"}, [el("div", {class: "eyebrow", text: "Done"}), el("h1", {text: "Thank you, " + S.rater}),
    el("p", {text: "Send all of the text below to Andre, by message or email. Nothing has been sent yet."}),
    ta, el("div", {class: "row"}, [send, copy, status]),
    el("div", {class: "row"}, [el("button", {class: "quiet", text: "← Review my last answer", on: {click: back}}), reset])]));
}
document.addEventListener("keydown", e => {
  if (!S || S.pos >= S.seq.length || e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.pos === firstB() && !S.seenB) return;
  const it = S.seq[S.pos], k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "backspace"){ e.preventDefault(); back(); }
  else if (it.k !== "B" && "12345".includes(k) && k.length === 1) answer(+k);
  else if (it.k === "B" && (k === "y" || k === "n")) answer(k === "y" ? 1 : 0);
});
render();
</script>
</body>
</html>
